# Reviewed false positives of scripts/leak_scan.py (design s2-recorder-masker §8.3).
# Gate configuration: every entry needs the CTO's review. An entry names the path, the
# detector, the SHA-256 of the matched text (never the text itself) and a reason. It
# allows that exact text at that path only. Never add an entry for a real identifier:
# remove the value instead.

