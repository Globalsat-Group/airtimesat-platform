# Licence gate allow-list, read by scripts/licence_gate.py (`make security`).
# Any licence not listed here fails the gate, GPL, AGPL, LGPL and unknown included,
# unless the package is in exceptions.toml. Changing this file is a reviewed change.

# SPDX identifiers allowed without review.
allowed = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "ISC",
    "PSF-2.0",
    "Python-2.0",
    "MPL-2.0",
]

# Licence names found in package metadata (mostly trove classifiers), mapped to SPDX.
# Only add a name here if it means exactly one SPDX licence.
[aliases]
"MIT License" = "MIT"
"Apache Software License" = "Apache-2.0"  # classifier carries no version; Apache 1.x is not on PyPI in practice
"Apache License 2.0" = "Apache-2.0"
"Apache 2.0" = "Apache-2.0"
"ISC License (ISCL)" = "ISC"
"ISC License" = "ISC"
"Python Software Foundation License" = "PSF-2.0"
"Mozilla Public License 2.0 (MPL 2.0)" = "MPL-2.0"
"BSD 3-Clause License" = "BSD-3-Clause"
"BSD 2-Clause License" = "BSD-2-Clause"
# The "BSD License" classifier does not say which variant. In practice it is the 2- or
# 3-clause licence; check the package's licence file when a new package uses it.
"BSD License" = "BSD-3-Clause"
