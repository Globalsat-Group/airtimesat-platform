# CI gates for airtimesat-platform (re-plan §3.3).
# The job ids below are the required status checks on main. Do not rename them
# without updating the branch ruleset (docs/SETUP_CHECKLIST.md).
# Each job installs only what it needs and then calls the matching make target,
# so CI and `make check` run the same commands. The one exception is recorder-check: it
# judges a pull request's changed plans with the base commit's checker, where `make plans`
# uses the working tree's.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs. Pushes to main get one group per commit, so every
# main commit keeps its own result. cancel-in-progress stays a literal boolean:
# checkov silently skips a workflow whose value is an expression.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.32"
  TERRAFORM_VERSION: "1.9.8"
  CHECKOV_VERSION: "3.3.29"
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  ACTIONLINT_VERSION: "1.7.4"
  ACTIONLINT_SHA256: "fc0a6886bbb9a23a39eeec4b176193cadb54ddbe77cdbb19b637933919545395"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: make lint
        run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: make typecheck
        run: make typecheck

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: make contracts
        run: make contracts

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: make test
        run: make test

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so gitleaks also sees secrets added and removed in earlier commits.
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: make security
        run: make security
      # The working-tree scan above misses a value added and removed inside a pull request,
      # so every commit of the pull request is scanned too (design s2-recorder-masker §8.3).
      - name: leak scan over the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked python scripts/leak_scan.py --history "${BASE_SHA}..${HEAD_SHA}"
      - name: gitleaks on git history
        run: gitleaks git . --redact --no-banner --verbose

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install checkov
        run: |
          set -euo pipefail
          uv tool install "checkov==${CHECKOV_VERSION}"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: make terraform
        run: make terraform

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install checkov
        run: |
          set -euo pipefail
          uv tool install "checkov==${CHECKOV_VERSION}"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: make workflows
        run: make workflows

  # Recording plans (design s2-recorder-masker §7.3, §9.2). The checker is the base commit's,
  # never the pull request's, so a pull request cannot change the checker that judges it. It
  # can change this job, though: a pull_request run uses the pull request's own workflow file.
  # What protects the job itself is Code Owner review of .github/ and the bot having no
  # Workflows permission (docs/SETUP_CHECKLIST.md); never approve a pull request that changes
  # both a plan and a workflow. A pull request that changes a plan touches nothing else, and
  # recording-plans/ holds regular files only. It runs on every pull request, so it can be a
  # required check: with no changed plan it prints a notice and passes. No secret, no vault,
  # no network beyond installing the base commit's locked dependencies.
  recorder-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request head (full history, for the diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: head
      - name: Check out the base commit (the checker that judges the plans)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: List the changed recording plans
        id: plans
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Paths are NUL-separated end to end, so spaces or odd characters in a name are safe.
          git -C head diff --name-only -z --no-renames "${BASE_SHA}...${HEAD_SHA}" \
            > "$RUNNER_TEMP/changed.list"
          # Every status but deleted, so a type change (a plan turned into a symlink) is judged.
          git -C head diff --name-only -z --no-renames --diff-filter=d "${BASE_SHA}...${HEAD_SHA}" \
            -- recording-plans/ > "$RUNNER_TEMP/plans.relative"
          # recording-plans/ holds regular files only: a symlink (120000) would be judged by its
          # target, which a later pull request could change unseen, and a submodule (160000)
          # would not be judged at all.
          git -C head ls-tree -r -z "$HEAD_SHA" -- recording-plans/ > "$RUNNER_TEMP/tree.list"
          while IFS= read -r -d '' entry; do
            case "${entry%% *}" in
              100644|100755) ;;
              *)
                echo "::error::recorder-check: recording-plans/ may hold only regular files, no symlink or submodule."
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/tree.list"
          plans=()
          while IFS= read -r -d '' path; do
            plans+=("$GITHUB_WORKSPACE/head/$path")
          done < "$RUNNER_TEMP/plans.relative"
          others=0
          while IFS= read -r -d '' path; do
            case "$path" in
              recording-plans/*) ;;
              *) others=$((others + 1)) ;;
            esac
          done < "$RUNNER_TEMP/changed.list"
          if [ "${#plans[@]}" -eq 0 ]; then
            echo "::notice::recorder-check: this pull request changes no recording plan."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$others" -ne 0 ]; then
            echo "::error::recorder-check: a pull request that changes a recording plan touches nothing else (design s2-recorder-masker §7.3)."
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/base/src/airtimesat_platform/recorder/plan.py" ]; then
            echo "::error::recorder-check: the base commit has no recorder check yet, so no plan can be judged. Merge the checker first."
            exit 1
          fi
          printf '%s\0' "${plans[@]}" > "$RUNNER_TEMP/plans.list"
          echo "count=${#plans[@]}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.plans.outputs.count != '0'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # No cache: this job installs only the base commit's locked environment.
          enable-cache: false
      - name: recorder check, with the base commit's checker
        if: steps.plans.outputs.count != '0'
        working-directory: base
        run: |
          set -euo pipefail
          mapfile -d '' -t plans < "$RUNNER_TEMP/plans.list"
          uv sync --locked
          uv run --locked python -m airtimesat_platform.recorder check -- "${plans[@]}"
