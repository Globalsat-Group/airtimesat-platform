  - operation: "getIwsRequests"
    direction: response
    path: "getIwsRequestsResponse/response/iwsLogs/iwsLog/request"
    treatment: D
    reason: "iwsLogImpl.request: the logged request as escaped XML (design §3.1 Embedded payloads; §4.4). Stricter D (an optional string, written as REDACTED) rather than N with an embedded rule: the engine's embedded walk masks the leaves under the logged request element but not text that follows a child element (its tail), so only the pattern detectors would see such text, and a name there would pass. Plan 002 needs only caller, requestId and requestedOperation, which are classified on their own. Open point: N can return after an engine change walks or drops every tail in an embedded payload"
  - operation: "getIwsRequests"
    direction: response
    path: "getIwsRequestsResponse/response/iwsLogs/iwsLog/response"
    treatment: D
    reason: "iwsLogImpl.response: the logged response as escaped XML (design §3.1 Embedded payloads; §4.4). Stricter D (an optional string, written as REDACTED) rather than N: a logged getIwsRequests response holds the log IWS returned to the recorder before the caller filter, so other callers' entries would be masked rather than removed (against design §5.3, §8.5 #19), and the caller filter sees the escaped payload as text. The recorder already writes each call's own masked response, so the logged copy adds nothing. D also avoids the N output rescan, which blocks a logged version or long ID. Open point: N can return only after an engine change drops an embedded getIwsRequests or getIwsRequest payload or runs the caller filter on nested logs"
