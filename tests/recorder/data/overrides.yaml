# Synthetic overrides for the recorder tests. Identifier inputs are reversible, so a plan
# must name them by surrogate; enums, limits and dates are kept, so a reference there is
# refused. accountSearch/request/comment is free text (F). getPrepaidAccountDetail has a C
# and a P-ONE request field, so a blank filter of either class can be tested. The IWS log
# entries (iwsLog) carry a caller, for the run's caller filter and caller keep (S2 PR D2).
format: airtimesat-overrides/1
entries:
  - {operation: accountSearch, direction: request, path: request, treatment: KEEP}
  - {operation: accountSearch, direction: request, path: request/filterType, treatment: KEEP}
  - operation: accountSearch
    direction: request
    path: request/filterValue
    treatment: TYPED
    typed_by:
      sibling: filterType
      values: {IMEI: "T-NUM:IMEI", MSISDN: "T-NUM:MSISDN", ACCOUNT_NUMBER: "T-NUM:CONTRACT", VESSEL_NAME: "T-STR:VESSEL", IP_ADDRESS: T-IP}
  - {operation: accountSearch, direction: request, path: request/filterCond, treatment: KEEP}
  - {operation: accountSearch, direction: request, path: request/limit, treatment: KEEP}
  - {operation: accountSearch, direction: request, path: request/startRow, treatment: KEEP}
  - {operation: accountSearch, direction: request, path: request/status, treatment: KEEP}
  - {operation: accountSearch, direction: request, path: request/comment, treatment: F}
  - {operation: accountSearch, direction: response, path: accountSearchResponse, treatment: KEEP}
  - {operation: accountSearch, direction: response, path: accountSearchResponse/totalNumberOfRecords, treatment: KEEP}
  - {operation: accountSearch, direction: response, path: accountSearchResponse/subscribers, treatment: KEEP}
  - {operation: accountSearch, direction: response, path: accountSearchResponse/subscribers/subscriber, treatment: KEEP}
  - {operation: accountSearch, direction: response, path: accountSearchResponse/subscribers/subscriber/accountNumber, treatment: T-NUM, type: CONTRACT}
  - {operation: accountSearch, direction: response, path: accountSearchResponse/subscribers/subscriber/imei, treatment: T-NUM, type: IMEI}
  - {operation: accountSearch, direction: response, path: accountSearchResponse/subscribers/subscriber/accountStatus, treatment: KEEP}
  - {operation: accountSearch, direction: response, path: accountSearchResponse/subscribers/subscriber/detailsType, treatment: KEEP}
  - operation: accountSearch
    direction: response
    path: accountSearchResponse/subscribers/subscriber/details
    treatment: TYPED
    typed_by:
      sibling: detailsType
      values: {IMEI: "T-NUM:IMEI", SIM: "T-NUM:ICCID"}
