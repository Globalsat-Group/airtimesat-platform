# Optional local hooks (install with `uvx pre-commit install`). CI does not
# depend on them: `make check` and the CI jobs are the gate.
# ruff runs from the project environment, so its version is the one in uv.lock.
# gitleaks is pinned to the same version CI uses (8.21.2), by commit SHA.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      # Real identifiers (IMEI, ICCID, MSISDN, addresses, ...) in staged files. Installed on
      # the trusted machine (design s2-recorder-masker §8.3, §10.2 step 2). Every file is
      # passed, binary ones included: the scan itself refuses binary, compressed and
      # non-UTF-8 files under tests/fixtures/ and recording-plans/.
      - id: leak-scan
        name: leak scan
        entry: uv run python scripts/leak_scan.py
        language: system

  - repo: https://github.com/gitleaks/gitleaks
    rev: 43fae355e6fe4d99d2a7b240a224b85e2903aeb4 # v8.21.2
    hooks:
      - id: gitleaks
