[project]
name = "airtimesat-platform"
version = "0.0.0"
description = "Globalsat platform over Iridium: Phase 1 Ops console and IWS gateway, Phase 2 TAP archive and mediation."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.13"
# Runtime dependencies. Stage S2 adds the recorder's IWS path (design s2-recorder-masker §7.3):
# aiohttp (gateway transport), lxml (masker and gateway XML), cryptography (vault values) and
# pyyaml (only behind the recording plans' strict loader). xsdata arrives with stage S3.
# No boto3, asyncpg or new web framework in S2. Exact versions live in uv.lock.
dependencies = [
    "aiohttp>=3.14.5,<4",
    "cryptography>=50.0.2,<51",  # major lines move often: each one is a reviewed bump
    "fastapi>=0.150.0,<0.151",  # still 0.x: pinned to the minor line (Annex F, §6.1)
    "jinja2>=3.1.6,<4",
    "lxml>=6.1.3,<7",
    "pydantic-settings>=2.16.0,<3",
    "pyyaml>=6.0.3,<7",
    "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.5,<7",
    "import-linter>=2.15,<3",
    "lxml-stubs>=0.5.1,<0.6",  # lxml 6 ships no type information
    "pip-audit>=2.10.1,<3",
    "pip-licenses>=5.5.5,<6",
    "pyright[nodejs]>=1.1.414,<1.2",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.1,<0.18",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "A",            # builtins shadowing
    "C4",           # comprehensions
    "S",            # bandit
    "SIM",          # simplify
    "PT",           # pytest style
    "TID",          # tidy imports
    "RUF",          # ruff-specific
    "D2", "D3", "D4",  # docstring formatting (docstrings are the placeholders for now)
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- pyright
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests", "scripts"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "error"
reportUnnecessaryTypeIgnoreComment = "error"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--cov=airtimesat_platform",
    "--cov-report=term-missing",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

# ---------------------------------------------------------------- import-linter
# Module boundaries. tests/test_import_contracts.py fails if any contract below is removed.
# Changing these contracts changes the architecture: this file is on the mandatory-review list.
# The S2 changes follow design docs/design/s2-recorder-masker.md §7.3.
[tool.importlinter]
root_packages = ["airtimesat_platform"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "console-boundary"
name = "console imports only domain, common and gateway.api"
type = "forbidden"
source_modules = ["airtimesat_platform.console"]
forbidden_modules = [
    "airtimesat_platform.gateway",
    "airtimesat_platform.masker",
    "airtimesat_platform.archive",
    "airtimesat_platform.recorder",
]
# gateway.api is the gateway's public port. The gateway may use its own internals behind it,
# so only direct imports from console are checked.
ignore_imports = [
    "airtimesat_platform.console -> airtimesat_platform.gateway.api",
    "airtimesat_platform.console.** -> airtimesat_platform.gateway.api",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "domain-pure"
name = "domain imports nothing else from the app"
type = "forbidden"
source_modules = ["airtimesat_platform.domain"]
forbidden_modules = [
    "airtimesat_platform.gateway",
    "airtimesat_platform.masker",
    "airtimesat_platform.console",
    "airtimesat_platform.archive",
    "airtimesat_platform.common",
    "airtimesat_platform.recorder",
]

[[tool.importlinter.contracts]]
id = "domain-no-io-frameworks"
name = "domain uses no I/O frameworks"
type = "forbidden"
source_modules = ["airtimesat_platform.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "jinja2",
    "pydantic_settings",
    "aiohttp",
    "xsdata",
    "lxml",
]

[[tool.importlinter.contracts]]
id = "masker-isolated"
name = "masker imports only common"
type = "forbidden"
# The masking engine stays pure: the recorder depends on it, never the reverse.
source_modules = ["airtimesat_platform.masker"]
forbidden_modules = [
    "airtimesat_platform.gateway",
    "airtimesat_platform.domain",
    "airtimesat_platform.console",
    "airtimesat_platform.archive",
    "airtimesat_platform.recorder",
]

[[tool.importlinter.contracts]]
id = "masker-no-transport"
name = "masker imports no HTTP or SOAP binding library"
type = "forbidden"
# The masker may use lxml to mask; HTTP stays in the gateway. Indirect imports are checked
# too: the masker imports no app code that could pull HTTP in.
source_modules = ["airtimesat_platform.masker"]
forbidden_modules = ["aiohttp", "xsdata"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "archive-isolated"
name = "archive imports only domain and common"
type = "forbidden"
source_modules = ["airtimesat_platform.archive"]
forbidden_modules = [
    "airtimesat_platform.gateway",
    "airtimesat_platform.masker",
    "airtimesat_platform.console",
    "airtimesat_platform.recorder",
]

[[tool.importlinter.contracts]]
id = "soap-libraries-gateway-only"
name = "only gateway imports aiohttp, xsdata and lxml"
type = "forbidden"
# masker (lxml only, see masker-no-transport) and recorder (see recorder-no-soap-libraries)
# have their own contracts.
source_modules = [
    "airtimesat_platform.console",
    "airtimesat_platform.domain",
    "airtimesat_platform.archive",
    "airtimesat_platform.common",
]
forbidden_modules = ["aiohttp", "xsdata", "lxml"]
# console reaches the gateway through gateway.api; only direct imports are checked.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "recorder-boundary"
name = "recorder imports only common, masker and gateway.sitest_port"
type = "forbidden"
source_modules = ["airtimesat_platform.recorder"]
forbidden_modules = [
    "airtimesat_platform.gateway",
    "airtimesat_platform.console",
    "airtimesat_platform.domain",
    "airtimesat_platform.archive",
]
# The recorder reaches IWS only through the SITEST port. The gateway may use its own
# internals behind it, so only direct imports from recorder are checked.
ignore_imports = [
    "airtimesat_platform.recorder -> airtimesat_platform.gateway.sitest_port",
    "airtimesat_platform.recorder.** -> airtimesat_platform.gateway.sitest_port",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "recorder-no-soap-libraries"
name = "recorder imports aiohttp, xsdata and lxml only through masker or gateway"
type = "forbidden"
# XML parsing stays in the masker, HTTP in the gateway.
source_modules = ["airtimesat_platform.recorder"]
forbidden_modules = ["aiohttp", "xsdata", "lxml"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "sitest-only"
name = "recorder, masker and the SITEST port never reach a production-capable port"
type = "forbidden"
# A Beta or production endpoint in agent-reachable code is a defect (CLAUDE.md). gateway.api
# is the console's port and reaches production endpoints from S4. gateway.endpoints_production
# does not exist yet; import-linter skips a forbidden module that is not in the graph, so
# tests/test_import_contracts.py pins the name.
source_modules = [
    "airtimesat_platform.recorder",
    "airtimesat_platform.masker",
    "airtimesat_platform.gateway.sitest_port",
]
forbidden_modules = [
    "airtimesat_platform.gateway.api",
    "airtimesat_platform.gateway.endpoints_production",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "gateway-one-way"
name = "gateway imports neither masker nor recorder"
type = "forbidden"
source_modules = ["airtimesat_platform.gateway"]
forbidden_modules = [
    "airtimesat_platform.masker",
    "airtimesat_platform.recorder",
]

[[tool.importlinter.contracts]]
id = "ports-apart"
name = "gateway.api never imports gateway.sitest_port"
type = "forbidden"
source_modules = ["airtimesat_platform.gateway.api"]
forbidden_modules = ["airtimesat_platform.gateway.sitest_port"]
